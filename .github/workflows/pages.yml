name: Deploy public resources

on:
  push:
    branches: [main]
    paths:
      - public-resources/**
      - .github/workflows/pages.yml
      - scripts/check-public-resources.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate immutable resources and stable entries
        run: node scripts/check-public-resources.mjs
        env:
          ASTRAIL_RESOURCE_BASE: ${{ github.event.before }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-resources

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy resources
        id: deployment
        uses: actions/deploy-pages@v4
